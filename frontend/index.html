<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080E0D" />
    <meta name="description" content="Riffmancer turns your MIDI keyboard into a full band: make post punk, metal, punk, drum &amp; bass and reggaeton beats without knowing music theory." />
    <meta property="og:image" content="/riffmancer-emblem.png" />
    <link rel="icon" type="image/svg+xml" href="/riffmancer-mark.svg" />

    <link rel="preload" as="image" href="/riffmancer-emblem.webp" />
    <title>Riffmancer</title>

  <body>
    <!-- Recolours the green skull artwork for the Blood Moon theme (see src/theme/themes.ts). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="emblem-blood" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.45 1.25 0.2 0 0  0.02 0.22 0.02 0 0  0.02 0.2 0.04 0 0  0 0 0 1 0" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
