[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riffmancer-backend"
version = "0.1.0"
description = "Local audio processing API for Riffmancer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=8.3,<9",
]
separation = [
  "demucs>=4.0.1,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
